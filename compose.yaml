services:
  draftproof:
    build:
      context: .
      args:
        VITE_DRAFTPROOF_PACKAGE_ID: ${VITE_DRAFTPROOF_PACKAGE_ID:-0xca75e449585b717ae2f7ae7bb9902a89873087fdc51f4639349a9b98cee019c3}
        VITE_SEAL_KEY_SERVER_IDS: ${VITE_SEAL_KEY_SERVER_IDS:-0xb012378c9f3799fb5b1a7083da74a4069e3c3f1c93de0b27212a5799ce1e1e98}
        VITE_SEAL_AGGREGATOR_URL: ${VITE_SEAL_AGGREGATOR_URL:-https://seal-aggregator-testnet.mystenlabs.com}
        VITE_WALRUS_AGGREGATOR_URL: ${VITE_WALRUS_AGGREGATOR_URL:-https://aggregator.walrus-testnet.walrus.space}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/draftproof.db
      APP_ORIGIN: http://localhost:3000
    volumes:
      - draftproof-data:/data

volumes:
  draftproof-data:
